<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps ni Sir Cliff</title>

     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

      <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style> 
     #map { 
        height: 300px; 
    }
    </style>


</head>
<body>
    <h1>Maps ni sir Cliff</h1>
     <div id="map"></div>
<script>
    function initMap(mapDataUrl){
        const map = L.titleLayer([8.3603,124.8684],17)

        //open street map
        const openStreetMap = L.titleLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
            maxZoom:19,
            attribution:'&copy; OpenStreetMap contributors'
        })

        //Satellite
        const satellite = L.titleLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {attribution:'Tiles (c) Esri - Source, Maxar, Earthstar Geographics, and GIS User Community'}
        );

        openStreetMap.addTo(map);
        console.log("Base map tile layer loaded" + Date());

        const markerGroups = {};


        fetch(mapDataUrl)
        .then(response => response.json())
        .then(data=>{
            data.forEach(pin=> {
                const type = pint.locationType || "Other";
                 
                //Create Marker Group
                if(!markerGroups[type]){
                    markerGroups[type] = L.layerGroup();
                }

                //Marker and Popup
                const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                const img = <img src='${pin.img}' class="popup-image">;
                marker.bindPopup(`
                ${img} <br>
                <br>${pin.title}<br>
                ${pin.description}
                `);
                console.log({pin.name} Loaded  + Date());

                markerGroups[type].addLayer(marker);
            });

            //Add marker groups into the map according to marker filter
            Object.values(markerGroups).forEach(group => group.addTo(map));

 
          })

        })
    }
document.addEventListener("DOMContentLoaded",()=>{
    initMap('campus-map.json');
});

</script>


</body>
</html>
